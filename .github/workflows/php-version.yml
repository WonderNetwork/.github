name: Determine PHP version

on:
  workflow_call:
    outputs:
      version_short:
        description: Short version, eg 85
        value: ${{ jobs.version.outputs.version_short }}
      version:
        description: minor.major version, eg. 8.5
        value: ${{ jobs.version.outputs.version }}
      image:
        description: docker image to run this PHP version
        value: ${{ jobs.version.outputs.image }}

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_short: ${{ steps.version.outputs.version_short }}
      image: ${{ steps.version.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine required PHP version
        id: version
        run: |
          if [ ! -f "composer.lock" ]; then
            echo "composer.lock not found" >&2
            exit 1
          fi
          
          platform_req="$(jq -r '.platform.php[2:]//""' < composer.lock)"
          
          if [ -z "$platform_req" ]; then
            echo "There is no PHP requirement defined in composer.lock" >&2
            exit 1
          fi

          version_short="$(jq -r '. * 10')"

          {
            echo "version_short=$version_short" 
            echo "version=$platform_req"
            echo "image=ghcr.io/wondernetwork/web-php$version_short"
          } > "$GITHUB_OUTPUT"
